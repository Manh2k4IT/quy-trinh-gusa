services:
  - type: web
    name: gusa-quy-trinh-app
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    disk:
      name: gusa-quy-trinh-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false