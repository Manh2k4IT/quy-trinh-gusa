        <div class="sidebar-scroll"><p class="menu-label">DANH MỤC</p><nav class="menu"><a class="menu-item" href="organization-chart.html"><span class="menu-icon">▤</span><span>Sơ đồ tổ chức</span></a><a class="menu-item" href="#"><span class="menu-icon">⌘</span><span>Quy Trình</span></a><a class="menu-item" href="#"><span class="menu-icon">◷</span><span>Chấm Công</span></a><a class="menu-item" href="#"><span class="menu-icon">▣</span><span>Lương &amp; KPI</span></a><a class="menu-item" href="#"><span class="menu-icon">♙</span><span>Tuyển dụng</span></a><a class="menu-item" href="#"><span class="menu-icon">▱</span><span>Đơn từ &amp; Đề Xuất</span></a><a class="menu-item" href="#"><span class="menu-icon">▤</span><span>Biểu mẫu &amp; Văn bản</span></a><a class="menu-item" href="#"><span class="menu-icon">▥</span><span>Báo cáo doanh số</span></a></nav><p class="menu-label">QUẢN TRỊ</p><nav class="menu"><a class="menu-item" href="user-management.html"><span class="menu-icon">⚙</span><span>Quản lý user</span></a><a class="menu-item" href="#"><span class="menu-icon">▥</span><span>Thùng rác</span></a><a class="menu-item" href="#"><span class="menu-icon">◉</span><span>Nhật ký lỗi</span></a></nav></div>

        <header class="topbar"><button class="mobile-menu-toggle" type="button" data-mobile-menu-toggle aria-label="Mở menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg></button><div class="breadcrumbs"><button class="navigation-arrow" type="button" data-history-back aria-label="Quay lại"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button><span>Quy Trình</span><span class="crumb-separator">/</span><strong>Hồ sơ vị trí</strong></div><label class="search-box"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 5 5" /></svg><input type="search" placeholder="Tìm phòng ban, chức danh..." aria-label="Tìm phòng ban hoặc chức danh" /></label><div class="top-actions"><div class="role-switch" aria-label="Vai trò"><button class="role-chip is-selected" type="button">Quản trị</button><button class="role-chip" type="button">Nhân viên</button></div><button class="top-icon" type="button" data-theme-trigger aria-label="Đổi giao diện sáng tối"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" /></svg></button><button class="top-avatar" type="button" data-top-avatar aria-label="Mở thông tin tài khoản">B</button></div></header>

          <form class="profile-form member-form" data-member-form hidden><input name="id" type="hidden" /><label>Họ và tên<input name="name" maxlength="120" required /></label><label>Chức danh<input name="title" maxlength="120" /></label><label>Trạng thái<select name="status"><option value="working">Đang làm việc</option><option value="leave">Nghỉ phép</option><option value="former">Đã nghỉ việc</option></select></label><label class="file-upload-field">Ảnh đại diện<input name="avatar" type="file" accept="image/png,image/jpeg,image/webp" /><small>Chọn ảnh PNG, JPG hoặc WEBP, tối đa 5 MB.</small></label><label>Email<input name="email" type="email" maxlength="160" /></label><label>Số điện thoại<input name="phone" maxlength="40" /></label><label>Số năm làm việc<input name="workYears" type="number" min="0" max="80" step="1" placeholder="Ví dụ: 3" /></label><label>Mô tả công việc<textarea name="description" rows="5" maxlength="1000"></textarea></label><div class="profile-form-actions"><button class="chart-primary-button" type="submit">Lưu thành viên</button><button class="chart-close-button" type="button" data-member-cancel>Hủy</button></div></form>
          <p class="profile-status" data-profile-status role="status"></p>
        </section>
      </main>
