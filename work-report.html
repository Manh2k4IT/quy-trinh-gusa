<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Báo cáo công việc - Quy Trình</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="management.css?v=20261105-5" />
    <link rel="stylesheet" href="kpi.css?v=20261103-exceed" />
    <link rel="stylesheet" href="work-report.css?v=20261103-exceed" />
  </head>
  <body>
    <div class="mobile-menu-backdrop" data-mobile-menu-backdrop hidden></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand"><div class="mini-logo"><img src="logo1.jpg" alt="" /></div><span>Gusa - Quy Trình</span><button class="sidebar-toggle" type="button" data-sidebar-toggle aria-label="Thu gọn menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="15" rx="3" /><path d="M9.5 4.5v15" /><path class="sidebar-toggle-arrow" d="m15.5 10-2 2 2 2" /></svg></button></div>
        <div class="sidebar-scroll"></div>
        <div class="sidebar-account"><div class="avatar" data-user-avatar>B</div><div><strong data-user-name></strong><small data-user-role></small></div><a class="sidebar-logout" href="/auth/logout">Đăng xuất</a></div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <button class="mobile-menu-toggle" type="button" data-mobile-menu-toggle aria-label="Mở menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg></button>
          <div class="breadcrumbs"><span>Gusa - Quy Trình</span><span class="crumb-separator">/</span><strong>Báo cáo công việc</strong></div>
          <div class="top-actions"><div class="role-switch" aria-label="Vai trò"><button class="role-chip is-selected" type="button">Quản trị</button><button class="role-chip" type="button">Nhân viên</button></div><button class="top-avatar" type="button" data-top-avatar aria-label="Tài khoản">B</button></div>
        </header>
        <section class="wr-content">
          <div class="wr-hero">
            <div>
              <span class="wr-eyebrow">BIỂU MẪU</span>
              <h1>Báo cáo công việc</h1>
              <p data-wr-date>Báo cáo hôm nay</p>
            </div>
            <span class="wr-status" data-wr-status hidden></span>
          </div>
          <nav class="wr-tabs" data-wr-tabs aria-label="Báo cáo công việc">
            <button type="button" class="is-active" data-wr-tab="mine">📝 Cần nộp</button>
            <button type="button" data-wr-tab="history">🕘 Lịch sử của tôi</button>
            <button type="button" data-wr-tab="kpi" data-manager-only hidden>📈 Tiến độ KPI</button>
            <button type="button" data-wr-tab="overview" data-manager-only hidden>📊 Theo dõi</button>
            <button type="button" data-wr-tab="templates" data-manager-only hidden>🧩 Mẫu báo cáo</button>
            <button type="button" data-wr-tab="structure" data-manager-only hidden>🏢 Phòng ban &amp; vị trí</button>
          </nav>
          <section data-wr-panel="mine"><p class="wr-empty">Đang tải...</p></section>
          <section data-wr-panel="history" hidden></section>
          <section data-wr-panel="kpi" hidden>
            <div class="wr-kpi-head">
              <div><h2>📈 Tiến độ KPI</h2><p>Báo cáo của các mẫu đánh dấu KPI: tỷ lệ nộp và chỉ số so với chỉ tiêu. <a href="kpi.html">Mở trang Lương &amp; KPI ›</a></p></div>
              <label class="kpi-month">Tháng<input type="month" data-kpi-month /></label>
            </div>
            <div class="kpi-stats" data-kpi-stats></div>
            <input type="search" class="kpi-search" placeholder="Tìm nhân viên, phòng ban..." data-kpi-search hidden />
            <div class="kpi-list" data-kpi-list aria-live="polite"></div>
          </section>
          <section data-wr-panel="overview" hidden></section>
          <section data-wr-panel="templates" hidden></section>
          <section data-wr-panel="structure" hidden></section>
        </section>
      </main>
    </div>
    <div class="wr-modal" data-wr-modal hidden><div class="wr-modal-card" role="dialog" aria-modal="true"><button class="wr-modal-close" type="button" data-wr-close aria-label="Đóng">×</button><div data-wr-modal-body></div></div></div>
    <script src="kpi.js?v=20261103-exceed"></script>
    <script src="work-report.js?v=20261103-exceed"></script>
    <script src="admin-menu.js?v=20261105-icons"></script>
  </body>
</html>
