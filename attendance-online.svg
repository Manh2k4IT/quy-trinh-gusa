<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Làm việc online: máy tính có bản đồ vị trí và điện thoại chụp ảnh">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset=".6" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#e9f6ef"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3e6"/>
      <stop offset="1" stop-color="#c9e9d5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c2a5"/>
      <stop offset="1" stop-color="#c8ad8c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1b3a6b" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="560" cy="70" r="90" fill="#fff" opacity=".55"/>
  <circle cx="70" cy="300" r="120" fill="#dcefe3" opacity=".6"/>
  <!-- window -->
  <g opacity=".9">
    <rect x="44" y="40" width="150" height="120" rx="12" fill="#fff"/>
    <rect x="54" y="50" width="62" height="100" rx="6" fill="#cfe3ff"/>
    <rect x="122" y="50" width="62" height="100" rx="6" fill="#cfe3ff"/>
    <circle cx="90" cy="80" r="14" fill="#fff6d6"/>
    <path d="M54 130c20-18 34-18 62 0v20H54z" fill="#b9d8c4"/>
    <path d="M122 135c22-16 40-16 62 2v13h-62z" fill="#b9d8c4"/>
  </g>

  <!-- desk -->
  <rect x="0" y="282" width="640" height="78" fill="url(#desk)"/>
  <rect x="0" y="282" width="640" height="8" fill="#b8996f" opacity=".55"/>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="190" y="100" width="250" height="168" rx="14" fill="#1f3b63"/>
    <rect x="202" y="112" width="226" height="144" rx="8" fill="url(#screen)"/>
    <!-- map roads -->
    <path d="M202 170h226M260 112v144M202 222c60-16 120 18 226-6M340 112c-10 50 14 96 0 144" stroke="#fff" stroke-width="7" fill="none" opacity=".9"/>
    <rect x="276" y="130" width="46" height="30" rx="5" fill="#b5ddc2"/>
    <rect x="356" y="182" width="56" height="28" rx="5" fill="#b5ddc2"/>
    <rect x="214" y="186" width="34" height="24" rx="5" fill="#bfe0ff"/>
    <!-- pin -->
    <g transform="translate(316 132)">
      <path d="M0 58C-4 40-26 30-26 6a26 26 0 0 1 52 0C26 30 4 40 0 58z" fill="#e5484d"/>
      <circle cx="0" cy="6" r="10" fill="#fff"/>
    </g>
    <circle cx="316" cy="192" r="16" fill="#e5484d" opacity=".18"/>
    <path d="M168 268h294l-16 18H184z" fill="#c9d4e3"/>
    <rect x="290" y="268" width="50" height="6" rx="3" fill="#a9b6c8"/>
  </g>

  <!-- check badge -->
  <g filter="url(#shadow)">
    <circle cx="430" cy="110" r="30" fill="#22a06b"/>
    <path d="M416 110l10 10 20-20" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- phone with camera -->
  <g filter="url(#shadow)" transform="rotate(-8 500 220)">
    <rect x="468" y="150" width="78" height="138" rx="14" fill="#263f66"/>
    <rect x="476" y="164" width="62" height="104" rx="7" fill="#f4f7fb"/>
    <rect x="491" y="194" width="32" height="24" rx="5" fill="#174b8e"/>
    <circle cx="507" cy="206" r="7" fill="#f4f7fb"/>
    <circle cx="507" cy="206" r="3.5" fill="#174b8e"/>
    <rect x="501" y="189" width="12" height="6" rx="2" fill="#174b8e"/>
    <circle cx="507" cy="246" r="9" fill="#e5484d"/>
    <circle cx="507" cy="246" r="4" fill="#fff"/>
  </g>

  <!-- mug -->
  <g>
    <rect x="112" y="236" width="42" height="48" rx="8" fill="#ffffff"/>
    <path d="M154 248h8a10 10 0 0 1 0 20h-8" stroke="#ffffff" stroke-width="6" fill="none"/>
    <rect x="112" y="236" width="42" height="10" rx="4" fill="#8a5a3b"/>
    <path d="M126 222c-4-6 4-10 0-16M138 222c-4-6 4-10 0-16" stroke="#9aa8bb" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M574 284h40l-6-40h-28z" fill="#f2ede6"/>
    <path d="M594 244c-2-28-12-44-30-56 20 2 32 22 30 56z" fill="#5f8f5a"/>
    <path d="M594 244c4-30 18-48 34-52-14 12-24 30-34 52z" fill="#7aa86f"/>
    <path d="M594 244c-1-36 4-62 14-80 0 30-6 54-14 80z" fill="#4f7d4c"/>
  </g>
</svg>
