  <body>
    <div class="mobile-menu-backdrop" data-mobile-menu-backdrop hidden></div>

      <main class="workspace">
        <header class="topbar">

          <div class="salary-stats" data-salary-stats></div>
          <input type="search" class="salary-search" placeholder="Tìm theo tên hoặc Gmail..." data-salary-search />
