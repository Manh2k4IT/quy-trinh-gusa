<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chờ duyệt - Quy Trình</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="pending.css" />
  </head>
  <body>
    <main class="pending-shell">
      <section class="pending-card" aria-labelledby="pending-title">
        <div class="pending-icon" aria-hidden="true">⌛</div>
        <p class="eyebrow">QUY TRÌNH NỘI BỘ</p>
        <h1 id="pending-title">Tài khoản đang chờ duyệt</h1>
        <p class="pending-copy">
          Yêu cầu đăng ký của bạn đã được ghi nhận. Quản trị viên sẽ kiểm tra và kích hoạt tài khoản trước khi bạn có thể truy cập hệ thống.
        </p>
        <div class="pending-user">
          <span class="pending-avatar" data-pending-avatar>G</span>
          <span>
            <strong data-pending-name>Tài khoản Google</strong>
            <small data-pending-email></small>
          </span>
        </div>
        <a class="back-login" href="/">Quay lại trang đăng nhập</a>
      </section>
    </main>
    <script src="pending.js"></script>
  </body>
</html>
