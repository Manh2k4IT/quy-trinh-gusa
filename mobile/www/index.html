<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f8fb" />
    <title>Gusa Quy Trinh</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #173f78; background: #f5f8fb; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom)); place-items: center; text-align: center; }
      main { width: min(100%, 360px); }
      h1 { margin: 0 0 .7rem; font-size: 1.35rem; }
      p { color: #66778d; line-height: 1.6; }
      a { display: inline-grid; min-height: 46px; margin-top: .7rem; padding: 0 1.1rem; place-items: center; border-radius: 7px; color: #fff; background: #174b8e; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Không kết nối được Gusa Quy Trinh</h1>
      <p>Kiểm tra kết nối internet rồi thử mở lại ứng dụng.</p>
      <a href="https://quytrinh.gusa.vn">Mở hệ thống</a>
    </main>
  </body>
</html>
